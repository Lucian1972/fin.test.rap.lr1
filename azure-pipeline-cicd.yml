trigger:
    branches:
        include:
            - main
            - main-op
            - fix-*
            - feature-*
            - infinity
            - rel-*
            - soh*
        exclude:
            - config/services
    batch: true
    paths:
        include:
            - '*'
pr:
    branches:
        include:
            - main
            - main-op
            - fix-*
            - feature-*
            - infinity
            - rel-*
            - soh*
        exclude:
            - config/services
parameters:
    - name: executionMode
      displayName: Execution Mode
      type: string
      default: ci
      values:
        - ci
        - quality
        - securityrescan
        - translationdownload
resources:
    repositories:
        - repository: fiori-pipeline-azure
          endpoint: github.tools.sap
          type: githubenterprise
          name: FIORI-PIPELINE/fiori-pipeline-azure
extends:
    template: fiori-pipeline.yml@fiori-pipeline-azure
    parameters:
        executionmode: ${{ parameters.executionMode }}
        pool: nons4-fiori
